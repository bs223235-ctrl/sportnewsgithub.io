<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Design and Development Course</title>
  <style>
    body {
      margin: 0;
      font-family: monospace;
      background: url('gifin.gif') no-repeat center center/cover;
      color: white;
      height: 100vh;
      position: relative;
    }

    /* Верхнее меню */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 40px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    nav a:hover {
      color: orange;
    }

    /* Поиск */
    .search-box {
      margin-left: 40px;
      display: flex;
      align-items: center;
    }

    .search-box input {
      padding: 8px 10px;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
    }

    .search-box button {
      background: orange;
      border: none;
      padding: 8px 15px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-weight: bold;
    }

    /* Заголовок и текст */
    .content {
      position: absolute;
      top: 30%;
      left: 10%;
      max-width: 400px;
    }

    .content h1 {
      font-size: 40px;
      line-height: 1.2;
    }

    .content p {
      font-size: 14px;
      margin: 15px 0 25px;
      color: #f0f0f0;
    }

   

    /* Блок входа */
    .login-box {
      position: absolute;
      top: 30%;
      right: 10%;
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 10px;
      width: 250px;
    }

    .login-box h2 {
      margin-top: 0;
      background: white;
      color: black;
      text-align: center;
      padding: 8px 0;
      border-radius: 4px;
    }

    .login-box input {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
      border: none;
      border-radius: 4px;
    }

    .login-box button {
      width: 100%;
      background: orange;
      border: none;
      padding: 10px;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .login-box p {
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .social {
      text-align: center;
      margin-top: 10px;
    }

    .social a {
      color: white;
      margin: 0 5px;
      text-decoration: none;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="#">Главная</a>
      <a href="#">О нас</a>
      <a href="#">Сервисы</a>
      <a href="#">Дизайн</a>
      <a href="#">Контакты</a>
    </nav>

    <div class="search-box">
      <input type="text" placeholder="Поищи всё угодно">
      <button>Поиск</button>
    </div>
  </header>

 

  <div class="content">
    <h1>Веб-дизайн и <span style="color:orange;">моушн дизайн</span> курсы</h1>
    <p>Выбери свой формат от текстовых краткострочных курсов до 9 месяцев полноценного обучения</p>
  </div>

  <div class="login-box">
    <h2>Зарегистироваться</h2>
    <input type="email" placeholder="Напишите свой email">
    <input type="password" placeholder="Напишите свой пароль">
    <button>Войти</button>
    <p>У вас есть аккаунт? <a href="#" style="color:orange;">Зарегистироваться бесплатно</a></p>
    <div class="social">
      <a href="#">🌐</a>
      <a href="#">📘</a>
      <a href="#">🐦</a>
      <a href="#">📸</a>
    </div>
  </div>

</body>
</html>
